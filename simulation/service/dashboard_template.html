<title>Reclaimify Console</title>
<style>
/* ---------------------------------------------------------------------------
   Same visual system as service/case_room.py: warm off-white, system sans,
   hairline rules, 7px cards, one blue accent, and three status colours used
   only as labelled tags. No webfont, so nothing loads from the network.

   Those status colours are never adjacent series on a chart. Green and red
   cannot clear deuteranopia separation as neighbours at any lightness, so
   wherever both recovered and admitted are needed the chart is two
   single-series panels. That also fixes a scale problem: recovery runs about
   fifteen times fraud admitted, and on a shared axis the line that matters
   most would sit flat on the baseline.
--------------------------------------------------------------------------- */
:root{--bg:#faf9f7;--fg:#1a1a1a;--mut:#6b6b6b;--line:#e2e0dc;--card:#fff;
--good:#1a7f4b;--bad:#b3261e;--warn:#a16207;--accent:#2b4c7e;
--soft:#f4f2ef;--sel:#eef2f8;--faint:#b6b2ab}
*{box-sizing:border-box}
/* The shell is a flex column rather than three boxes each subtracting a
   hardcoded header height. The header wraps to two or three lines on a narrow
   window, and calc(100vh - 61px) then left the panes taller than the space,
   which produced a page scrollbar next to an inner one and cut the bottom off
   every page. dvh, not vh, so mobile browser chrome does not do the same. */
html{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
font:15px/1.55 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif;
display:flex;flex-direction:column;height:100dvh;overflow:hidden}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{flex:none;padding:12px 22px;border-bottom:1px solid var(--line);
background:var(--card);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:680;letter-spacing:-.02em;
display:flex;align-items:center;gap:7px}
.tick{width:7px;height:7px;border-radius:99px;background:var(--good);
box-shadow:0 0 0 3px #1a7f4b22;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hby{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);
font-weight:650;border-left:1px solid var(--line);padding-left:14px}
.hstats{display:flex;gap:0;flex-wrap:wrap;margin-left:auto}
.hp{display:flex;flex-direction:column;gap:1px;padding:0 15px;
border-left:1px solid var(--line);font-size:10.5px;color:var(--mut);
text-transform:uppercase;letter-spacing:.05em;font-weight:650;line-height:1.3}
.hp b{font-size:14px;color:var(--fg);text-transform:none;letter-spacing:-.01em;
font-variant-numeric:tabular-nums;font-weight:650}
.hp.dim b{color:var(--mut);font-weight:600}
.sub{color:var(--mut);font-size:13px}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr)}
.list{border-right:1px solid var(--line);background:var(--card);
overflow-y:auto;min-height:0}
.row{display:block;width:100%;text-align:left;font:inherit;color:inherit;
padding:11px 14px;border:0;border-bottom:1px solid var(--line);
border-left:3px solid transparent;background:none;cursor:pointer}
.row:hover{background:var(--soft)}
.row.sel{background:var(--sel);border-left-color:var(--accent)}
.row .t{font-weight:600;font-size:13.5px}
.row .d{font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.4}
main{padding:24px 28px 64px;overflow-y:auto;min-width:0;min-height:0}
main>*{max-width:1060px}

h2{margin:0;font-size:23px;font-weight:650;letter-spacing:-.02em;text-wrap:balance}
.lede{color:var(--mut);font-size:15px;margin:8px 0 0;max-width:66ch}
h3{margin:30px 0 11px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;
color:var(--mut);font-weight:650}
p{margin:0 0 10px;max-width:70ch}
p.note{color:var(--mut);font-size:13px}
.num{font-variant-numeric:tabular-nums}

.card{background:var(--card);border:1px solid var(--line);border-radius:7px}
.card>h4{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);
font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);
font-weight:650;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card>.b{padding:14px 16px}
.grid{display:grid;gap:14px}
.two{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.tiles{grid-template-columns:repeat(auto-fit,minmax(min(176px,100%),1fr))}
/* input beside output on the agent page. min(...,100%) so it collapses to one
   column instead of forcing a 630px floor and scrolling the whole body. */
.io{grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));
align-items:start}

.tile{background:var(--card);border:1px solid var(--line);border-radius:7px;
padding:13px 15px}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;
color:var(--mut);font-weight:650;display:block;line-height:1.35}
.tile .v{font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:6px;
font-variant-numeric:tabular-nums;line-height:1.15;display:block}
.tile .s{font-size:12px;color:var(--mut);margin-top:4px;display:block;line-height:1.4}
.tile.hi{box-shadow:inset 3px 0 0 var(--accent)}
.tile.hi .v{color:var(--accent)}
.tile.pos .v{color:var(--good)}.tile.neg .v{color:var(--bad)}

.tag{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;
padding:1px 6px;border-radius:3px;font-weight:650;white-space:nowrap}
.good{background:#e6f4ec;color:var(--good)}.bad{background:#fbeae9;color:var(--bad)}
.warn{background:#fdf4e3;color:var(--warn)}
.neut{background:var(--soft);color:var(--mut)}
.blue{background:var(--sel);color:var(--accent)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
color:var(--mut);font-weight:650;padding:6px 10px;border-bottom:1px solid var(--line);
white-space:nowrap;background:var(--card);position:sticky;top:0}
td{padding:5px 10px;border-bottom:1px solid var(--soft);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.mark td{background:var(--sel)}
tr.mark td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.scroll{overflow-x:auto}

pre{background:var(--soft);border:1px solid var(--line);border-radius:6px;
padding:11px 13px;overflow-x:auto;margin:0;
font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
pre .c{color:var(--mut)}pre .k{color:var(--accent);font-weight:600}
pre .g{color:var(--good);font-weight:600}pre .r{color:var(--bad);font-weight:600}
code{background:var(--soft);padding:1px 4px;border-radius:3px;
font:12.5px ui-monospace,Menlo,Consolas,monospace}

textarea{width:100%;min-height:300px;background:var(--soft);color:var(--fg);
border:1px solid var(--line);border-radius:6px;padding:11px 13px;resize:vertical;
font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
button.btn{background:var(--card);border:1px solid var(--line);color:var(--fg);
font:inherit;font-size:13.5px;padding:7px 15px;border-radius:6px;cursor:pointer}
button.btn:hover{border-color:var(--accent);color:var(--accent)}
button.btn.go{background:var(--accent);color:#fff;border-color:var(--accent);
font-weight:600}
button.btn.go:hover{background:#23406c;color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);
font:inherit;font-size:12px;padding:3px 10px;border-radius:99px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.flat{cursor:default;background:var(--soft);
font:11.5px ui-monospace,Menlo,monospace}
.chip.flat:hover{border-color:var(--line);color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}

.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:142px 1fr 104px;gap:11px;
align-items:center;font-size:12.5px}
.bar-track{background:var(--soft);border-radius:3px;height:15px;overflow:hidden}
.bar-fill{height:100%;border-radius:0 3px 3px 0}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut);
font-size:12px}

figure{margin:0}
figcaption{font-size:13px;color:var(--mut);margin-top:9px;line-height:1.5;max-width:76ch}
svg.chart{display:block;width:100%;height:auto}
/* the wide pipeline diagram keeps its own width and scrolls, rather than
   scaling its 11px labels down to something nobody can read on a phone */
.wide{overflow-x:auto}
.wide>svg{min-width:720px}
.tip{position:fixed;pointer-events:none;background:#1a1a1a;color:#fff;
border-radius:5px;padding:6px 9px;font-size:12px;z-index:50;opacity:0;
transition:opacity .1s;font-variant-numeric:tabular-nums;max-width:250px;
line-height:1.45;box-shadow:0 3px 12px rgba(0,0,0,.22)}
.tip.on{opacity:1}
.note-box{background:var(--card);border:1px solid var(--line);
border-left:3px solid var(--accent);border-radius:7px;padding:13px 16px;margin:14px 0}
.note-box.w{border-left-color:var(--bad)}
.note-box p:last-child{margin-bottom:0}
.foot{color:var(--mut);font-size:12.5px;margin-top:26px;border-top:1px solid var(--line);
padding-top:12px;max-width:78ch}

/* ---- the agent page ------------------------------------------------------ */
/* case pickers */
.pick{margin-top:18px;display:flex;flex-direction:column;gap:7px}
.pickrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);
font-weight:650;min-width:9.5em}
.chip.s{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 11px}
.chip.s .dot{width:7px;height:7px;border-radius:99px;flex:none}
.dot.good{background:var(--good)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}

/* fields / json tabs */
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tb{background:var(--card);border:0;border-right:1px solid var(--line);color:var(--mut);
font:inherit;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
font-weight:650;padding:4px 11px;cursor:pointer}
.tb:last-child{border-right:0}
.tb.sel{background:var(--sel);color:var(--accent)}

/* one field */
.fg{margin-bottom:20px}
.fg:last-of-type{margin-bottom:4px}
.fg h5{margin:0 0 3px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;
color:var(--fg);font-weight:650}
.fg .note{margin:0 0 10px;max-width:60ch}
.fields{display:grid;gap:8px 16px;
grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.f{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,124px);gap:10px;
align-items:center;padding:4px 0;border-bottom:1px solid var(--soft)}
.f label{cursor:pointer;min-width:0}
.fl{display:block;font-size:13px;line-height:1.35}
.fl i{color:var(--mut);font-style:normal;font-size:11.5px}
.fk{display:block;font:10.5px ui-monospace,Menlo,Consolas,monospace;color:var(--faint);
overflow:hidden;text-overflow:ellipsis}
.fc{display:flex;align-items:center;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.f input[type=number],.f input[type=text],.f select{width:100%;min-width:0;
background:var(--card);border:1px solid var(--line);border-radius:5px;color:var(--fg);
font:12.5px ui-monospace,Menlo,Consolas,monospace;padding:4px 7px;text-align:right}
.f select,.f input[type=text]{text-align:left;font-family:inherit;font-size:12.5px}
.f input:focus,.f select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.money{display:flex;align-items:center;gap:4px;width:100%}
.money span{font-size:11.5px;color:var(--mut)}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
.sw input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.fc .tag{flex:none}

/* verdict */
.verdict{border-left:3px solid var(--line)}
.verdict.good{border-left-color:var(--good)}
.verdict.bad{border-left-color:var(--bad)}
.verdict.warn{border-left-color:var(--warn)}
.vhead{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.va{font-size:25px;font-weight:650;letter-spacing:-.02em}
.va.good{color:var(--good)}.va.bad{color:var(--bad)}.va.warn{color:var(--warn)}
.vw{color:var(--mut);font-size:13.5px}

/* the trace */
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;
padding:0 0 18px;position:relative}
.step:before{content:"";position:absolute;left:12.5px;top:24px;bottom:0;
width:1px;background:var(--line)}
.step:last-child:before{display:none}
.sn{width:26px;height:26px;border-radius:99px;background:var(--sel);color:var(--accent);
font-size:12px;font-weight:650;display:flex;align-items:center;justify-content:center;
z-index:1}
.sb{min-width:0}
.sb h5{margin:4px 0 8px;font-size:13.5px;font-weight:650}
.sb pre{font-size:12px;line-height:1.55}
.sb .note{max-width:64ch}

/* what moved it */
.movers{display:flex;flex-direction:column;gap:5px}
.mv{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.3fr) 62px;
gap:9px;align-items:center;font-size:12px}
.mf{font:11.5px ui-monospace,Menlo,Consolas,monospace;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.mn{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;
overflow:hidden;text-overflow:ellipsis}
.mn i{font-style:normal;color:var(--faint)}
.mt{background:var(--soft);border-radius:3px;height:11px;overflow:hidden}
.mb{display:block;height:100%;border-radius:0 3px 3px 0}
.mb.up{background:var(--bad)}.mb.dn{background:var(--good)}
.md{text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:600}
.md.r{color:var(--bad)}.md.g{color:var(--good)}

/* the policy ladder */
.ladder{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);
border-radius:6px;overflow:hidden;background:var(--line)}
.rung{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:9px;
align-items:start;padding:9px 12px;background:var(--card);font-size:12.5px}
.rung.fired{background:var(--sel)}
.rung.skip{color:var(--faint)}
.rung.skip .rt,.rung.skip .rs{color:var(--faint)}
.ri{color:var(--accent);font-size:13px;line-height:1.5}
.rung.reached .ri{color:var(--mut)}
.rt{font:12px ui-monospace,Menlo,Consolas,monospace;display:block}
.rs{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}
.rung.fired .rt{font-weight:600;color:var(--accent)}

/* ---- the live board and the recovery page -------------------------------- */
.lhead{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;
flex-wrap:wrap}
.lctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--card);border:0;border-right:1px solid var(--line);
color:var(--mut);font:inherit;font-size:11.5px;padding:6px 11px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sel);color:var(--accent);font-weight:650}

.board{display:grid;gap:11px;margin:18px 0 16px;
grid-template-columns:repeat(auto-fit,minmax(min(168px,100%),1fr))}
.board .tile .v{transition:color .25s}
.lcols{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));
align-items:start}

/* feeds */
.feed{max-height:376px;overflow-y:auto;padding:8px 10px}
.fr,.fl{display:grid;align-items:center;gap:9px;padding:6px 4px;
border-bottom:1px solid var(--soft);font-size:12.5px}
.fr{grid-template-columns:auto minmax(0,1fr) auto auto auto}
.fr:last-child,.fl:last-child{border-bottom:0}
.fm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fa{font-weight:600;white-space:nowrap}
.fp{color:var(--mut);font-size:11.5px;white-space:nowrap}
.fc{display:flex;gap:3px;white-space:nowrap}
.fl{grid-template-columns:auto minmax(0,1fr) auto minmax(52px,88px) auto}
.fbar{background:var(--soft);border-radius:99px;height:5px;overflow:hidden}
.fbar>span{display:block;height:100%;background:var(--accent);
border-radius:99px;transition:width .3s linear}

/* the channel glyph, used in feeds, tables and ladders */
.ch{display:inline-flex;align-items:center;justify-content:center;
width:20px;height:20px;border-radius:5px;font-size:11px;font-style:normal;
line-height:1;flex:none}
.ch.good{background:#e6f4ec;color:var(--good)}
.ch.blue{background:var(--sel);color:var(--accent)}
.ch.neut{background:var(--soft);color:var(--mut)}
.ch.warn{background:#fdf4e3;color:var(--warn)}
.ch.bad{background:#fbeae9;color:var(--bad)}

/* a ladder, drawn */
.chain{display:flex;flex-direction:column;gap:2px}
.cstep{display:flex;gap:9px;align-items:flex-start;padding:6px 0}
.cn{display:block;font-size:13px;font-weight:600;line-height:1.3}
.ct{display:block;font-size:11.5px;color:var(--mut);margin-top:1px}
.carr{color:var(--faint);font-size:12px;padding-left:6px;line-height:1}
.tot{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
font-size:12.5px;color:var(--mut)}
.tot span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;
font-weight:650;margin-right:8px}

.sub-row td{padding-top:0;padding-bottom:9px;border-bottom:1px solid var(--soft)}
.sub-row .note{margin:0;max-width:74ch}

.slider{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.slider label{font-size:12.5px;color:var(--mut);flex:none}
.slider input[type=range]{flex:1;min-width:180px}

@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}

/* the sidebar plus two 320px cards needs about 1000px; below that give the
   cards the whole width before anything has to overflow */
@media(max-width:1040px){
  .wrap{grid-template-columns:196px minmax(0,1fr)}
  main{padding:22px 20px 60px}
}
/* nav becomes a scrolling tab strip across the top */
@media(max-width:820px){
  body{height:auto;overflow:visible}
  .wrap{grid-template-columns:1fr}
  .list{border-right:0;border-bottom:1px solid var(--line);
    display:flex;overflow-x:auto;overflow-y:hidden;
    position:sticky;top:0;z-index:20;-webkit-overflow-scrolling:touch}
  .row{flex:none;width:auto;white-space:nowrap;padding:10px 14px;
    border-bottom:0;border-left:0;border-bottom:3px solid transparent}
  .row.sel{border-left:0;border-bottom-color:var(--accent)}
  .row .d{display:none}
  main{overflow:visible;padding:20px 16px 56px}
  header{padding:12px 16px;gap:10px}
  .bar-row{grid-template-columns:minmax(88px,34%) 1fr auto}
  .pl{min-width:0;width:100%}
  .hstats{margin-left:0;width:100%;overflow-x:auto;padding-bottom:2px}
  .hp:first-child{padding-left:0;border-left:0}
  .hby{border-left:0;padding-left:0}
  .lhead{flex-direction:column;gap:12px}
  .feed{max-height:300px}
}
@media(max-width:560px){
  h2{font-size:20px}
  .lede{font-size:14.5px}
  .tile .v{font-size:21px}
  .card>h4{padding:10px 13px}
  .card>.b{padding:12px 13px}
  th,td{padding:5px 8px}
  .bar-row{grid-template-columns:minmax(76px,38%) 1fr auto;gap:8px;font-size:11.5px}
  .bar-row .n{font-size:11px}
  textarea{min-height:220px}
  .foot,figcaption,p{max-width:none}
  /* the agent page: the bar and the before/after values are the first things
     to go, because the field name and the size of the move are the content */
  .mv{grid-template-columns:minmax(0,1fr) 58px}
  .mn,.mt{display:none}
  .va{font-size:21px}
  .step{grid-template-columns:22px minmax(0,1fr);gap:10px}
  .step:before{left:10.5px;top:22px}
  .sn{width:22px;height:22px;font-size:11px}
  .rung{grid-template-columns:16px minmax(0,1fr);row-gap:5px}
  .rung .tag{grid-column:2}
  .f{grid-template-columns:minmax(0,1fr) minmax(0,104px)}
  /* the feed rows drop the score and the merchant before they drop the money
     and the channel, which are what the row is for */
  .fr{grid-template-columns:auto minmax(0,1fr) auto auto}
  .fr .fp{display:none}
  .fl{grid-template-columns:auto minmax(0,1fr) auto auto}
  .fl .fbar{display:none}
  .hp{padding:0 10px;font-size:9.5px}
  .hp b{font-size:12.5px}
  .board{gap:8px}
  .cstep{gap:7px}
}
</style>

<header>
  <h1>Reclaimify<span class="tick" aria-hidden="true"></span></h1>
  <span class="hby">false-decline recovery</span>
  <span class="hstats" id="hsub"></span>
</header>
<div class="wrap">

<script>
/* ===================================================================== utils */
const esc = (s) => String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const n0 = (x) => Math.round(x).toLocaleString("en-IN");
const pct = (x, d=1) => (100*x).toFixed(d) + "%";
function cr(x){
  const a = Math.abs(x), s = x < 0 ? "-" : "";
  if (a >= 1e7) return `${s}Rs ${(a/1e7).toFixed(2)} cr`;
  if (a >= 1e5) return `${s}Rs ${(a/1e5).toFixed(2)} L`;
  return `${s}Rs ${n0(a)}`;
}
/* An SMS costs 35 paise and cr() rounded that to "Rs 0", which made the
   cheapest channel on the page look free and the whole crossover argument
   look like it was about nothing. Anything under ten rupees keeps its paise. */
function rs(x){
  const a = Math.abs(x);
  if (a === 0) return "free";
  if (a < 10) return `${x < 0 ? "-" : ""}Rs ${a.toFixed(2)}`;
  return cr(x);
}
const C = { good:"#1a7f4b", bad:"#b3261e", warn:"#a16207", accent:"#2b4c7e",
            line:"#e2e0dc", mut:"#6b6b6b", faint:"#b6b2ab" };
const SANS = "ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif";

const tip = document.getElementById("tip");
function showTip(e, html){
  tip.innerHTML = html; tip.classList.add("on");
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - 10;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = innerHeight - r.height - 8;
  tip.style.left = x + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => tip.classList.remove("on");
addEventListener("scroll", hideTip, true);

/* ============================================================ the real model */
/* Transliterated from service/export_bundle.py. The exporter refuses to write a
   bundle unless this reproduces the fitted Python model on every holdout case,
   and service/check_dashboard.js re-runs these exact functions pulled out of
   the built page, so what runs here is the model rather than a stand-in. */
function rawScore(x){
  let total = 0;
  for (const tree of B.model.trees){
    let n = tree;
    while (Array.isArray(n)) n = x[n[0]] <= n[1] ? n[2] : n[3];
    total += n;
  }
  return 1 / (1 + Math.exp(-total));
}
function calibrate(v){
  const xs = B.model.iso_x, ys = B.model.iso_y;
  if (v <= xs[0]) return ys[0];
  if (v >= xs[xs.length-1]) return ys[ys.length-1];
  let lo = 0, hi = xs.length - 1;
  while (hi - lo > 1){ const m = (lo+hi) >> 1; if (xs[m] <= v) lo = m; else hi = m; }
  const span = xs[hi] - xs[lo];
  return span === 0 ? ys[lo] : ys[lo] + (ys[hi]-ys[lo]) * (v-xs[lo]) / span;
}
function vectorise(o){
  const missing = [];
  const x = B.model.features.map(f => {
    let v = o[f];
    // `amount` is paise; amount_inr is rupees. Deriving one from the other
    // without the factor of 100 quietly scores the order at 1/100th its size.
    if (v === undefined && f === "amount" && o.amount_inr != null)
      v = Number(o.amount_inr) * 100;
    if (v === undefined || v === null || v === "" || Number.isNaN(Number(v))){
      missing.push(f); return 0;
    }
    return Number(v);
  });
  return { x, missing };
}
/* core/policy.py decide(), same order of tests, same reason strings. */
function decide(p, amount, orders, tenure, cap){
  cap = cap ?? B.cap;
  const m = B.margin, f = B.dispute_overhead_inr;
  const ev = (1-p)*m*amount - p*(amount + f);
  const gate = [];
  if (orders < B.min_orders) gate.push(`thin_network_file(orders=${orders.toFixed(0)}<${B.min_orders})`);
  if (tenure < B.min_tenure_days) gate.push(`short_tenure(days=${tenure.toFixed(0)}<${B.min_tenure_days})`);
  const sufficient = gate.length === 0;
  const big = amount >= B.stepup_floor_inr;
  let action, reasons;
  if (p > B.uphold_floor){
    action = "UPHOLD";
    reasons = [`confidently_bad(p_bad=${p.toFixed(3)}>${B.uphold_floor})`];
    if (!sufficient) reasons = reasons.concat(["thin_file_but_uphold_needs_no_exculpation"], gate);
  } else if (!sufficient){
    action = big ? "STEP_UP" : "ESCALATE";
    reasons = ["insufficient_evidence"].concat(gate,
      [`amount_${big ? "above" : "below"}_stepup_floor`]);
  } else if (ev > 0 && p < cap){
    action = "OVERTURN";
    reasons = [`ev_positive(${ev>=0?"+":""}${n0(ev)})`, `p_bad_under_cap(${p.toFixed(3)}<${cap})`];
  } else {
    action = big ? "STEP_UP" : "UPHOLD";
    reasons = ["ambiguous", `ev=${ev>=0?"+":""}${n0(ev)}`, `p_bad=${p.toFixed(3)}`,
               `amount_${big ? "above" : "below"}_stepup_floor`];
  }
  return { action, ev, reasons, sufficient, gate };
}
const TONE = { OVERTURN:"good", UPHOLD:"bad", STEP_UP:"warn", ESCALATE:"warn" };

/* ============================================================ the recovery ladder */
/* Transliterated from core/recovery.py, the same way the model above is
   transliterated from the exporter. The bundle carries Python's plan for 300
   real holdout cases and service/check_agent.js replays every one of them
   through this code, so a page showing a different ladder than the numbers
   came from fails the build rather than the demo. */
const RC = B.recovery;
const CH = Object.fromEntries(RC.channels.map(c => [c.key, c]));
const RCFG = Object.assign({}, RC.cfg);

function rDecay(t, cfg){ return t <= 0 ? 1 : Math.exp(-Math.LN2 * t / cfg.half_life_min); }

function pReturn(c, elapsed, cfg, rung){
  const t = Math.max(0, elapsed) + c.latency;
  let p = c.reach * c.lift * rDecay(t, cfg);
  if (rung > 0) p *= Math.pow(1 - cfg.rung_correlation, rung);
  return Math.min(1, Math.max(0, p));
}
function ltvAtRisk(amount, orders, tenure, cfg){
  if (!cfg.count_ltv || orders < 3 || tenure < 90) return 0;
  return (orders / tenure) * cfg.ltv_horizon_days * amount * cfg.margin
         * cfg.churn_on_false_decline;
}
/* Which channels this action may use. A step-up is an unanswered question, so
   a one-way nudge cannot discharge it: that is a constraint on the channel,
   not a preference, and it is the only reason a voice agent is in the list. */
function allowedFor(action, inSession){
  if (action === "UPHOLD")   return [[], "block stands, nothing to recover"];
  if (action === "ESCALATE") return [[CH.human], "escalation is a person by definition"];
  if (action === "STEP_UP")
    return [RC.channels.filter(c => c.two_way),
            "a step-up is a question, so the channel has to take an answer"];
  if (inSession) return [[CH.auto], "still at checkout, so just let it through"];
  return [RC.channels.filter(c => c.key !== "auto"), "overturned, customer has left"];
}
function rPlan(action, evRelease, amount, orders, tenure, opts){
  opts = opts || {};
  const cfg = opts.cfg || RCFG;
  const elapsed = opts.elapsed || 0;
  const exclude = opts.exclude || [];
  let [pool, why] = allowedFor(action, !!opts.inSession);
  const reasons = [why];
  if (exclude.length){
    pool = pool.filter(c => exclude.indexOf(c.key) < 0);
    reasons.push(`unavailable(${exclude.slice().sort().join(",")})`);
  }
  if (opts.only) pool = pool.filter(c => c.key === opts.only);
  const V = evRelease + ltvAtRisk(amount, orders, tenure, cfg);
  // Whether to engage is already settled for two of the four actions. A
  // STEP_UP means the policy decided an exchange is warranted and an ESCALATE
  // means a person has to look, both because ev_release is NOT trustworthy on
  // that case - so re-testing ev_release to decide whether to bother is
  // circular, and it silently dropped three escalations on the floor.
  const committed = action === "STEP_UP" || action === "ESCALATE";
  const none = { action, value: V, rungs: [], p: 0, cost: 0, ev: 0, eta: 0, reasons };
  if (!pool.length) return none;
  if (V <= 0 && !committed){
    reasons.push(`conversion_worth_nothing(${Math.round(V)})`); return none; }

  const rungs = [], used = {};
  let remaining = 1, t = elapsed, spend = 0, etaNum = 0;
  for (let i = 0; i < cfg.max_rungs; i++){
    let best = null, bestEv = cfg.min_ev_inr || 0, bestP = 0;
    for (const c of pool){
      if (used[c.key]) continue;
      const p = pReturn(c, t, cfg, rungs.length);
      // `remaining` is the chance we are still trying: a rung only runs if
      // every earlier one missed, so its revenue and its cost both discount by it
      const ev = remaining * (p * V - c.cost);
      // an ordinary marketing floor. Without it, pure positive-EV greed put an
      // agentic phone call on a Rs 1,195 order for +Rs 1.83 of expected value
      if (c.cost > 0 && p * V < cfg.min_roas * c.cost) continue;
      if (ev > bestEv){ best = c; bestEv = ev; bestP = p; }
    }
    if (!best) break;
    rungs.push({ channel: best.key, at: t, cost: best.cost, p: bestP,
                 ev: bestEv, committed: false });
    used[best.key] = 1;
    spend += remaining * best.cost;
    etaNum += remaining * bestP * (t + best.latency);
    remaining *= (1 - bestP);
    t += Math.max(best.latency * 2, 30);
  }
  if (!rungs.length && committed){
    const c = pool.slice().sort((x, y) => x.cost - y.cost)[0];
    const p = pReturn(c, elapsed, cfg, 0);
    rungs.push({ channel: c.key, at: elapsed, cost: c.cost, p,
                 ev: p * V - c.cost, committed: true });
    reasons.push(`committed_${action.toLowerCase()}_floor(${c.key})`);
    spend = c.cost; remaining = 1 - p; etaNum = p * (elapsed + c.latency);
  }
  const pTotal = 1 - remaining;
  if (!rungs.length) reasons.push(`no_channel_pays_at(${Math.round(V)})`);
  return { action, value: V, rungs, p: pTotal, cost: spend,
           ev: rungs.reduce((a, r) => a + r.ev, 0),
           eta: pTotal > 0 ? etaNum / pTotal : 0, reasons };
}
function crossover(a, b, cfg){
  cfg = cfg || RCFG;
  const dp = pReturn(a, 0, cfg, 0) - pReturn(b, 0, cfg, 0);
  return dp <= 0 ? Infinity : (a.cost - b.cost) / dp;
}
const CHTONE = { auto:"good", sms:"blue", email:"neut", voice:"warn", human:"bad" };
const CHICON = { auto:"&#8987;", sms:"&#9993;", email:"&#64;", voice:"&#9742;", human:"&#128100;" };
function mins(m){
  if (m < 1) return "now";
  if (m < 60) return `${Math.round(m)} min`;
  if (m < 1440) return `${(m/60).toFixed(m < 600 ? 1 : 0)} h`;
  return `${(m/1440).toFixed(1)} d`;
}

/* ==================================================================== charts */
/* Several lines on one axis. Used only where the series are peers - four
   channels, not recovered-against-admitted - so the palette rule that forces
   small multiples elsewhere does not apply. Each line is still labelled at its
   own right-hand end rather than through a legend swatch, so nobody has to
   match a colour to read it. */
function svgMulti(series, names, colors, opts){
  opts = opts || {};
  const W = 620, H = opts.h || 200, P = { l:44, r:118, t:12, b:28 };
  const all = series.flat();
  const x0 = Math.min(...all.map(d => d.x)), x1 = Math.max(...all.map(d => d.x));
  const y1 = Math.max(...all.map(d => d.y)) * 1.08 || 1;
  const X = v => P.l + (v - x0) / (x1 - x0 || 1) * (W - P.l - P.r);
  const Y = v => H - P.b - v / y1 * (H - P.t - P.b);
  const ticks = [0, y1 / 2, y1];
  const xt = opts.xticks || [0, 240, 480, 960, 1440];
  // labels can collide when two lines end close together; nudge them apart
  const ends = series.map((s, i) => ({ i, y: Y(s[s.length - 1].y) }))
                     .sort((a, b) => a.y - b.y);
  ends.forEach((e, k) => { if (k && e.y - ends[k-1].y < 13) e.y = ends[k-1].y + 13; });
  const labelY = {}; ends.forEach(e => labelY[e.i] = e.y);

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      preserveAspectRatio="xMidYMid meet" aria-label="${esc(opts.aria || "chart")}">
    ${ticks.map(t => `<line x1="${P.l}" x2="${W-P.r}" y1="${Y(t).toFixed(1)}"
        y2="${Y(t).toFixed(1)}" stroke="${C.line}"/>
      <text x="${P.l-8}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end" fill="${C.mut}"
        font-size="10.5" font-family="${SANS}">${(100*t).toFixed(0)}%</text>`).join("")}
    ${xt.filter(t => t >= x0 && t <= x1).map(t => `<text x="${X(t).toFixed(1)}"
        y="${H-9}" text-anchor="middle" fill="${C.mut}" font-size="10.5"
        font-family="${SANS}">${esc(mins(t))}</text>`).join("")}
    ${series.map((s, i) => `<polyline fill="none" stroke="${colors[i]}"
        stroke-width="2" stroke-linejoin="round"
        points="${s.map(d => `${X(d.x).toFixed(1)},${Y(d.y).toFixed(1)}`).join(" ")}"/>`).join("")}
    ${series.map((s, i) => {
      const last = s[s.length - 1];
      return `<line x1="${X(last.x).toFixed(1)}" x2="${(W-P.r+8).toFixed(1)}"
          y1="${Y(last.y).toFixed(1)}" y2="${labelY[i].toFixed(1)}"
          stroke="${colors[i]}" stroke-width="1" opacity=".45"/>
        <text x="${W-P.r+12}" y="${(labelY[i]+3.5).toFixed(1)}" fill="${colors[i]}"
          font-size="11" font-weight="600" font-family="${SANS}">${esc(names[i])}</text>`;
    }).join("")}
  </svg>`;
}
function svgLine(series, opts){
  const W = 560, H = opts.h || 156, P = { l:62, r:14, t:12, b:26 };
  const xs = series.map(d => d.x), ys = series.map(d => d.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(0, ...ys), y1 = Math.max(...ys);
  if (y1 === y0) y1 = y0 + 1;
  y1 += (y1 - y0) * 0.08;
  const X = v => P.l + (v - x0) / (x1 - x0 || 1) * (W - P.l - P.r);
  const Y = v => H - P.b - (v - y0) / (y1 - y0) * (H - P.t - P.b);
  const pts = series.map(d => `${X(d.x).toFixed(1)},${Y(d.y).toFixed(1)}`).join(" ");
  const area = `${X(x0).toFixed(1)},${Y(y0).toFixed(1)} ${pts} ${X(x1).toFixed(1)},${Y(y0).toFixed(1)}`;
  const id = "g" + Math.random().toString(36).slice(2, 8);
  // no fixed pixel height: width:100% plus the viewBox scales it to whatever
  // the card is, and an inline height would letterbox it instead.
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      preserveAspectRatio="xMidYMid meet" aria-label="${esc(opts.aria || "chart")}">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${opts.color}" stop-opacity=".16"/>
      <stop offset="1" stop-color="${opts.color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${[y0, (y0+y1)/2, y1].map(t => `<line x1="${P.l}" x2="${W-P.r}"
        y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="${C.line}"/>
      <text x="${P.l-8}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end" fill="${C.mut}"
        font-size="10.5" font-family="${SANS}">${esc(opts.fmt ? opts.fmt(t) : t.toFixed(0))}</text>`
      ).join("")}
    <polygon points="${area}" fill="url(#${id})"/>
    <polyline points="${pts}" fill="none" stroke="${opts.color}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${series.map((d,i) => `<circle class="pt" cx="${X(d.x).toFixed(1)}"
        cy="${Y(d.y).toFixed(1)}" r="3.2" fill="${opts.color}" stroke="#fff"
        stroke-width="2" data-i="${i}"/>`).join("")}
    ${(opts.xlabels||[]).map(l => `<text x="${X(l.x).toFixed(1)}" y="${H-8}"
        text-anchor="middle" fill="${C.mut}" font-size="10.5"
        font-family="${SANS}">${esc(l.t)}</text>`).join("")}
    ${opts.markX !== undefined ? `<line x1="${X(opts.markX).toFixed(1)}"
        x2="${X(opts.markX).toFixed(1)}" y1="${P.t}" y2="${H-P.b}"
        stroke="${C.accent}" stroke-width="1.5" stroke-dasharray="3 3"/>` : ""}
  </svg>`;
}
function wireChart(el, series, fmt){
  el.querySelectorAll("circle.pt").forEach(c => {
    const d = series[+c.dataset.i];
    c.addEventListener("mouseenter", e => { c.setAttribute("r", 5); showTip(e, fmt(d)); });
    c.addEventListener("mousemove", e => showTip(e, fmt(d)));
    c.addEventListener("mouseleave", () => { c.setAttribute("r", 3.2); hideTip(); });
  });
}
function barList(rows){
  const max = Math.max(...rows.map(r => r.v));
  return `<div class="bars">` + rows.map(r => `
    <div class="bar-row">
      <span>${esc(r.k)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${
        (100*r.v/max).toFixed(1)}%;background:${r.color || C.accent}"></span></span>
      <span class="n">${esc(r.n)}</span>
    </div>`).join("") + `</div>`;
}
</script>

<script>
/* ===================================================================== pages */
const PAGES = [];
const S = B.stats, H = B.headline, O = B.outcome, SD = B.seeds;
const impMap = Object.fromEntries(B.importance);

/* --------------------------------------------------------------- 1. live --- */
/* A running instance rather than a screenshot of one.

   What is real: the cases, sampled from the 1,775 blocked orders in the
   holdout; the probability, which the model produced; the action, which the
   policy produced; the recovery ladder, which core/recovery.py produced; and
   the answer key, which is revealed only after a case resolves and is never an
   input to anything.

   What is simulated: arrival times, and the coin that decides whether a
   contacted customer actually came back. That coin is drawn against the
   declared per-channel probability, seeded, and the header says so. Whether a
   returning order turns out to be fraud is NOT a coin - it is the answer key. */
let LIVE = null;

function mulberry(seed){          // small deterministic PRNG, so a run repeats
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function newRun(seed){
  const pool = B.recovery.check.slice();
  return {
    seed, rnd: mulberry(seed), t: 0, i: 0, pool,
    feed: [], inflight: [], done: [], closed: 0,
    // running totals, kept incrementally. `feed` and `done` are trimmed
    // for memory, so anything derived by walking them under-reports as
    // the run goes on - which is how the channel mix quietly started
    // showing the last two hundred cases instead of all of them.
    mix: {}, retGood: 0, retBad: 0, returnedAmount: 0,
    n: 0, released: 0, upheld: 0, asked: 0, escalated: 0,
    recovered: 0, admitted: 0, spend: 0, lost: 0, returns: 0, etas: [],
    playing: true, speed: 30,        // virtual minutes per real second
  };
}

function send(run, key){
  run.spend += CH[key].cost;
  const m = run.mix[key] || (run.mix[key] = { n: 0, cost: 0 });
  m.n++; m.cost += CH[key].cost;
}

function liveTick(run, dtMin){
  run.t += dtMin;
  // arrivals: the holdout window ran 29 blocked orders a day, so one every
  // ~50 virtual minutes. Kept honest rather than sped up to look busy.
  while (run.t >= run.i * 50){
    // 7919 is coprime with the pool size, so this walks every case before
    // repeating any. The pool is 400 cases and the board keeps running past
    // that, so a long demo does see the same orders again.
    const c = run.pool[(run.i * 7919) % run.pool.length];
    run.i++;
    run.n++;
    const at = run.t;
    if (c.action === "OVERTURN") run.released++;
    else if (c.action === "UPHOLD") run.upheld++;
    else if (c.action === "STEP_UP") run.asked++;
    else run.escalated++;
    const item = { c, at, rung: 0, state: c.chain.length ? "contacting" : "closed",
                   fired: [], key: `${c.payment_id}_${run.n}` };
    run.feed.unshift(item);
    if (run.feed.length > 40) run.feed.pop();
    if (c.chain.length){
      run.inflight.push(item);
      send(run, c.chain[0]);
    } else {
      run.closed++;              // upheld: nothing to recover, nothing to spend
    }
  }
  // resolutions
  for (let k = run.inflight.length - 1; k >= 0; k--){
    const it = run.inflight[k], c = it.c;
    const ch = CH[c.chain[it.rung]];
    const due = it.at + c.at[it.rung] + ch.latency;
    if (run.t < due) continue;
    const p = rPlan(c.action, c.ev, c.amount, c.orders, c.tenure)
              .rungs[it.rung].p;
    it.fired.push(ch.key);
    if (run.rnd() < p){
      // they came back. Whether that was a good order is the answer key,
      // not another coin.
      it.state = "returned"; it.at_done = run.t;
      run.returns++;
      run.etas.push(run.t - it.at);
      run.returnedAmount += c.amount;
      // good or bad is the answer key, not a second coin
      if (c.good){ run.recovered += c.amount; run.retGood++; }
      else { run.admitted += c.amount; run.retBad++; }
      run.inflight.splice(k, 1);
      run.done.push(it);
    } else if (it.rung + 1 < c.chain.length){
      it.rung++;
      send(run, c.chain[it.rung]);
    } else {
      it.state = "lost"; it.at_done = run.t;
      run.lost++;
      run.inflight.splice(k, 1);
      run.done.push(it);
    }
  }
  if (run.done.length > 200) run.done.splice(0, run.done.length - 200);
}

PAGES.push({ id:"live", nav:"Live", sub:"orders arriving and being worked",
  render(){
    const o = B.recovery.outcome;
    return `
  <div class="lhead">
    <div>
      <h2>The blocked pile, being worked</h2>
      <p class="lede">Real cases from the ${n0(O.n_cases)} blocked orders the model
      never trained on, arriving at the rate they actually arrived. The score, the
      action and the outreach ladder are the shipped ones. Arrival timing and
      whether a contacted customer came back are simulated, from a seeded draw
      against the declared per-channel rate.</p>
    </div>
    <div class="lctl">
      <button class="btn go" id="lplay">Pause</button>

    const vday = (t) => `day ${Math.floor(t / 1440) + 1}, ${

    function tile(k, v, s, cls){
      return `<div class="tile ${cls || ""}" style="padding:11px 13px">

        <span class="s">${s}</span></div>`;

    function paint(){
      const r = LIVE;
      const net = r.recovered * B.margin - r.admitted - r.spend;
      const medEta = r.etas.length

      statsEl.innerHTML =

        tile("Fraud admitted", cr(r.admitted), "bad orders that returned", "neg") +
        tile("Outreach spend", cr(r.spend), "messages, calls, reviewer time") +
        tile("Net contribution", cr(net),
             `${pct(B.margin,0)} margin, less fraud and spend`, net >= 0 ? "pos" : "neg") +
        tile("Median time to money", medEta ? mins(medEta) : "&mdash;",
             "from block to completed order", "hi");

      clockEl.textContent = vday(r.t);
      countEl.textContent = `${r.inflight.length} in flight`;

      feedEl.innerHTML = r.feed.slice(0, 14).map(it => {
        const c = it.c;

          <span class="fc">${c.chain.length

            : '<span class="sub">no contact</span>'}</span></div>`;
      }).join("") || '<p class="note" style="margin:0">waiting for the first order</p>';

      flightEl.innerHTML = r.inflight.slice(-10).reverse().map(it => {
        const c = it.c, ch = CH[c.chain[it.rung]];
        const due = it.at + c.at[it.rung] + ch.latency;
        const frac = Math.max(0, Math.min(1, (r.t - it.at) / Math.max(1, due - it.at)));
        return `<div class="fl">
          <span class="ch ${CHTONE[ch.key]}">${CHICON[ch.key]}</span>
          <span class="fm">${esc(ch.name)}</span>
          <span class="fa num">${cr(c.amount)}</span>
          <span class="fbar"><span style="width:${(100*frac).toFixed(0)}%"></span></span>
          <span class="sub num">${mins(Math.max(0, due - r.t))}</span></div>`;
      }).join("") || '<p class="note" style="margin:0">nothing in flight</p>';

      const tot = Object.values(r.mix).reduce((a, m) => a + m.n, 0) || 1;
      mixEl.innerHTML = `<div class="bars">${RC.channels.filter(c => r.mix[c.key])
        .map(c => `<div class="bar-row">
          <span>${esc(c.name)}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${
            (100*r.mix[c.key].n/tot).toFixed(1)}%;background:${
            {good:C.good,blue:C.accent,neut:C.mut,warn:C.warn,bad:C.bad}[CHTONE[c.key]]
            }"></span></span>
          <span class="n">${r.mix[c.key].n} &middot; ${rs(r.mix[c.key].cost)}</span>
          </div>`).join("")}</div>
        <p class="note" style="margin:10px 0 0">A human callback costs
        ${rs(CH.human.cost)} and an SMS ${rs(CH.sms.cost)}. The ladder spends the
        expensive one only where the case value carries it, which is the whole of
        the routing rule.</p>`;
    }

    let last = performance.now();
    function frame(now){
      if (!document.getElementById("lfeed")) return;      // page changed
      const dt = Math.min(250, now - last); last = now;
      if (LIVE.playing){ liveTick(LIVE, dt / 1000 * LIVE.speed); paint(); }
      requestAnimationFrame(frame);
    }
    paint();
    requestAnimationFrame(frame);
  }});

/* ---- the trace ----------------------------------------------------------- */
/* Everything the decision touched, in the order it touched it. None of this is
   narration written after the fact: every step reports what the same functions
   the page scores with actually produced. */
function treePath(tree, x){
  const steps = []; let n = tree;
  while (Array.isArray(n)){
    const fi = n[0], thr = n[1], v = x[fi], left = v <= thr;
    steps.push({ f:B.model.features[fi], v, thr, left });
    n = left ? n[2] : n[3];
  }
  return { steps, leaf:n };
}
function trace(o){
  const vr = vectorise(o), x = vr.x, missing = vr.missing;
  const paths = B.model.trees.slice(0, 3).map(t => treePath(t, x));
  let logit = 0;
  for (const t of B.model.trees){
    let n = t; while (Array.isArray(n)) n = x[n[0]] <= n[1] ? n[2] : n[3]; logit += n;
  }
  const uncal = 1 / (1 + Math.exp(-logit));
  const p = calibrate(uncal);

  /* which isotonic step the raw score landed on */
  const xs = B.model.iso_x, ys = B.model.iso_y;
  let lo = 0, hi = xs.length - 1, clamp = null;
  if (uncal <= xs[0]) clamp = "below the first knot";
  else if (uncal >= xs[xs.length-1]) clamp = "above the last knot";
  else { while (hi - lo > 1){ const m = (lo+hi) >> 1; if (xs[m] <= uncal) lo = m; else hi = m; } }

  /* one field at a time reset to its median over the blocked pile, everything
     else held. Not an attribution. A counterfactual, and labelled as one. */
  const movers = [];
  if (B.typical){
    B.model.features.forEach((f, i) => {
      const t = B.typical[f];
      if (t === undefined || Math.abs(t - x[i]) < 1e-12) return;
      const y = x.slice(); y[i] = t;
      const dd = calibrate(rawScore(y)) - p;
      if (Math.abs(dd) > 1e-9) movers.push({ f, from:x[i], to:t, d:dd });
    });
    movers.sort((a,b) => Math.abs(b.d) - Math.abs(a.d));
  }

  const amount = Number(o.amount_inr != null ? o.amount_inr
                        : (o.amount != null ? o.amount / 100 : 0)) || 0;
  const orders = Number(o.network_orders_prior || 0);
  const tenure = Number(o.network_tenure_days || 0);
  const d = decide(p, amount, orders, tenure);
  const big = amount >= B.stepup_floor_inr;

  /* the policy ladder: every rung, evaluated whether or not it fired */
  const rungs = [
    { t:`p_bad > ${B.uphold_floor}`, hit:p > B.uphold_floor, out:"UPHOLD",
      saw:`p_bad = ${p.toFixed(4)}`,
      why:"Confidently bad. Nothing else needs checking, because upholding a block needs no exculpatory evidence." },
    { t:"evidence gate fails", hit:!d.sufficient, out:big ? "STEP_UP" : "ESCALATE",
      saw:d.sufficient ? "gate passed" : d.gate.join(", "),
      why:"Too little record to act on. Big enough to be worth asking a question, otherwise a person reads it." },
    { t:`EV > 0 and p_bad < ${B.cap}`, hit:d.ev > 0 && p < B.cap, out:"OVERTURN",
      saw:`EV = ${d.ev >= 0 ? "+" : ""}${n0(d.ev)}, p_bad = ${p.toFixed(4)}`,
      why:"Releasing is worth money, and the model is confident enough for that price to mean something." },
    { t:"otherwise", hit:true, out:big ? "STEP_UP" : "UPHOLD",
      saw:`amount ${big ? "at or above" : "below"} ${n0(B.stepup_floor_inr)}`,
      why:"Ambiguous. Worth a verification exchange if the money justifies one, otherwise the block stands." },
  ];
  const fired = rungs.findIndex(r => r.hit);
  rungs.forEach((r, i) => { r.reached = i <= fired; r.fired = i === fired; });

  return { x, missing, paths, logit, uncal, p, iso:{ lo, hi, clamp }, movers,
           amount, orders, tenure, d, rungs, big };
}

/* ---- rendering one field ------------------------------------------------- */
function fieldHTML(d, v){
  const id = "fld_" + d.f;
  const warn = (d.lo !== undefined && (v < d.lo || v > d.hi))
    ? `<span class="tag warn" title="outside the range present in the holdout">outside range</span>` : "";
  let ctrl;
  if (d.kind === "flag")
    ctrl = `<label class="sw"><input type="checkbox" id="${id}" data-f="${d.f}"${
      Number(v) ? " checked" : ""}><span>${Number(v) ? "yes" : "no"}</span></label>`;
  else if (d.kind === "pick")
    ctrl = `<select id="${id}" data-f="${d.f}">${d.opts.map(o =>
      `<option${o === v ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else if (d.kind === "text")
    ctrl = `<input type="text" id="${id}" data-f="${d.f}" value="${esc(v == null ? "" : v)}">`;
  else if (d.kind === "money")
    ctrl = `<div class="money"><span>Rs</span><input type="number" id="${id}" data-f="${d.f}"
      value="${v}" step="100" min="0"></div>`;
  else
    ctrl = `<input type="number" id="${id}" data-f="${d.f}" value="${v}"
      step="${d.kind === "rate" ? "0.01" : d.step || 1}"${
      d.kind === "rate" ? ` min="0" max="1"` : d.kind === "count" ? ` min="0"` : ""}>`;
  return `<div class="f">
    <label for="${id}"><span class="fl">${esc(d.label)}${d.unit ? ` <i>${d.unit}</i>` : ""}</span>
    <span class="fk">${esc(d.f)}</span></label>
    <div class="fc">${ctrl}${warn}</div></div>`;
}

/* ---- the output --------------------------------------------------------- */
/* The output is a pure function of the case so service/check_agent.js can run
   it over every scenario and read the HTML. run() below only moves it into the
   DOM: anything that renders wrong renders wrong here too, where it is checked. */
/* A comparison is arithmetic, so print the number. fmt() turns a flag into
   yes/no, which reads as nonsense beside "<= 0.00". LightGBM's sentinel
   threshold for "is this zero" is 1e-35, which rounds to 0.00 and then looks
   like a value sitting exactly on its own split. */
function num(v){
  const n = +v;
  if (n !== 0 && Math.abs(n) < 0.005) return n > 0 ? "0.00+" : "-0.00";
  return Number.isInteger(n) ? String(n) : n.toFixed(Math.abs(n) >= 1000 ? 2 : 3);
}
function fmt(f, v){
  const d = FBY[f];
  if (!d) return Number.isInteger(v) ? v : (+v).toFixed(3);
  if (d.kind === "flag") return v ? "yes" : "no";
  if (d.kind === "rate") return (+v).toFixed(3);
  return Number.isInteger(+v) ? String(+v) : (+v).toFixed(2);
}

      "Reversing a block recovers nothing on its own. The ladder is tried cheapest first and a rung is added only while the rupees it is expected to bring in beat " + RCFG.min_roas + "x what it costs to send, so a small order stops early and a large one earns a person. A step-up can only use a channel that takes an answer.")}
  </div>

  <div class="note-box" style="margin:16px 0 0"><p style="margin:0">

    note the customer and the reviewer read, and three tests stop it doing anything
    else: the tools it can reach take no free text, the extraction schema has no
    field for a decision, and the verdict is handed a decision already made.</p></div>` };

PAGES.push({ id:"agent", nav:"Run the agent", sub:"one order, and how it was decided",

    let cur = {}, last = null;

    /* ---- the two views of one object ------------------------------------- */
    function paintFields(){
      GROUPS.forEach(g => {
        const host = document.querySelector(`.fields[data-g="${g.key}"]`);
        host.innerHTML = FIELDS.filter(d => d.g === g.key)
          .map(d => fieldHTML(d, cur[d.f] !== undefined ? cur[d.f]
            : (d.kind === "text" || d.kind === "pick" ? "" : 0))).join("");
      });
      host_wire();
    }
    function host_wire(){
      document.querySelectorAll("[data-f]").forEach(el => {
        el.oninput = () => {
          const d = FBY[el.dataset.f];
          // clearing a number field to retype it leaves "", which Number() reads
          // as 0. Re-scoring at zero mid-keystroke looks like the page guessing.
          if (el.type === "number" && el.value === "") return;
          cur[d.f] = d.kind === "flag" ? (el.checked ? 1 : 0)
            : (d.kind === "text" || d.kind === "pick") ? el.value : Number(el.value);
          if (d.f === "amount_inr") cur.amount = Number(el.value) * 100;
          if (d.kind === "flag") el.parentNode.querySelector("span").textContent =
            el.checked ? "yes" : "no";
          syncJSON(); run();
        };
      });
    }
    const syncJSON = () => { inp.value = JSON.stringify(cur, null, 2); };
    function readJSON(){
      try { cur = JSON.parse(inp.value); }

        out.innerHTML = `<div class="card"><div class="b">

          <p class="note" style="margin:10px 0 0">${esc(e.message)}. Fix the syntax, or
          switch back to Fields.</p></div></div>`;
        return false;
      }
      return true;
    }

    /* ---- loading a case --------------------------------------------------- */
    function load(json, note){
      cur = JSON.parse(JSON.stringify(json));
      if (cur.amount == null && cur.amount_inr != null) cur.amount = cur.amount_inr * 100;
      story.innerHTML = note || "";
      paintFields(); syncJSON(); run();
    }
    document.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {

      load(s.json, `<div class="note-box" style="margin:14px 0 0">
        <p style="margin:0"><b>${esc(s.chip)}.</b> ${esc(s.story)}</p></div>`);
    });
    document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
      const s = B.samples[+b.dataset.s];
      hint.textContent = "a real holdout case, with an answer key";
      load(s.json, `<div class="note-box" style="margin:14px 0 0">
        <p style="margin:0 0 6px"><b>${esc(s.role)}.</b> ${esc(s.why)}</p>
        <p class="note" style="margin:0">Answer key:
        <b style="color:${s.truth === "clean" ? C.good : C.bad}">${esc(s.truth)}</b>,
        persona <code>${esc(s.persona)}</code>. The decision below was made without it.</p>
        </div>`);
    });
    document.getElementById("reset").onclick = () =>
      document.querySelector("[data-w='0']").click();

    document.querySelectorAll(".tb").forEach(b => b.onclick = () => {
      const json = b.dataset.tab === "json";
      if (!json && !readJSON()) return;
      if (!json) paintFields();
      document.querySelectorAll(".tb").forEach(t => t.classList.toggle("sel", t === b));
      document.getElementById("tab-fields").hidden = json;
      document.getElementById("tab-json").hidden = !json;
      if (json) syncJSON();
    });
    document.getElementById("run").onclick = () => {
      if (!document.getElementById("tab-json").hidden && !readJSON()) return;
      run();
    };
    inp.addEventListener("keydown", e => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter"){ if (readJSON()) run(); } });

    function run(){
      const v = verdictHTML(cur, last);
      last = v.p; out.innerHTML = v.html;
    }

    document.querySelector("[data-w='0']").click();
  }});

  <h3>Where it runs changes what it is worth</h3>
  <p>Everything above assumes the review runs inline at checkout, where a released
  order converts at full value because the customer is still in session. As a queue
  review they have already gone elsewhere and only some come back when invited.</p>
  <div class="note-box"><p style="margin:0 0 8px"><b>Breakeven is a
  ${pct(B.queue.breakeven)} return rate.</b> That is the figure to quote, because it
  is the only one here that does not depend on guessing a parameter. Above it the
  programme makes money as a queue review; below it, it costs money to run.</p>
  <p class="note" style="margin:0">Declared assumption, not a measurement: only good
  releases are discounted. A fraudster invited back to finish a stolen-instrument
  order is more motivated to return than an honest customer who already bought
  elsewhere, so fraud admitted is booked in full at every rate. That is asserted,
  and asserted in the pessimistic direction.</p></div>
  <div class="card"><div class="b scroll"><table>
    <thead><tr><th>Deployment</th><th class="r">Recovered</th>
      <th class="r">Fraud admitted</th><th class="r">Net contribution</th></tr></thead>
    <tbody>${B.queue.rows.map(r => `<tr${r.rate === 1 ? ' class="mark"' : ""}>
      <td>${r.rate === 1 ? "inline at checkout, full value"
        : `queue review, ${pct(r.rate,0)} come back`}</td>
      <td class="r">${cr(B.queue.terms.R_gross_inr * r.rate)}</td>
      <td class="r">${cr(B.queue.terms.fraud_admitted_inr)}</td>
      <td class="r">${cr(r.net_contribution_inr)}</td></tr>`).join("")}</tbody>
  </table></div></div>
  <p class="note" style="margin-top:11px">Only the first term scales. Margin is
  ${pct(B.margin,0)} of a recovered rupee and fraud is 100% of an admitted one, so a
  fixed ${cr(B.queue.terms.drag_inr)} of drag comes off a quarter of a shrinking
  number, and contribution is roughly four times as sensitive to the return rate as
  revenue is.</p>`;
  },
  after(){
    const F = B.frontier;
    const xl = [0, Math.floor(F.length/2), F.length-1].map(i => ({x:F[i].cap, t:String(F[i].cap)}));
    for (const [key, color, el, name] of [
        ["recovered", C.good, "f-rec", "recovered"],
        ["admitted", C.bad, "f-adm", "fraud admitted"],
        ["contribution", C.warn, "f-net", "net contribution"]]){
      const s = F.map(r => ({ x:r.cap, y:r[key], r }));
      const node = document.getElementById(el);
      node.innerHTML = svgLine(s, { color, h:168, fmt:cr, markX:B.cap, xlabels:xl,
        aria:`${name} across the operating-point curve` });
      wireChart(node, s, d => `<b>cap ${d.r.cap}</b><br>${name} ${cr(d.y)}<br>
        ${n0(d.r.released)} released, ${pct(d.r.precision)} precision`);
    }
    const slider = document.getElementById("cap");
    const capv = document.getElementById("capv");
    const stats = document.getElementById("capstats");
    const rows = [...document.querySelectorAll("#ftab tbody tr")];
    function paint(){
      const r = F[+slider.value];
      capv.textContent = `cap ${r.cap}` + (r.cap === B.cap ? "  (shipped)" : "");
      stats.innerHTML = `
        <div class="tile" style="padding:11px 13px"><span class="k">Recall of recoverable</span>
          <span class="v" style="font-size:22px">${pct(r.recall)}</span></div>
        <div class="tile" style="padding:11px 13px"><span class="k">Precision</span>
          <span class="v" style="font-size:22px">${pct(r.precision)}</span></div>
        <div class="tile pos" style="padding:11px 13px"><span class="k">Recovered</span>
          <span class="v" style="font-size:22px">${cr(r.recovered)}</span></div>
        <div class="tile neg" style="padding:11px 13px"><span class="k">Fraud admitted</span>
          <span class="v" style="font-size:22px">${cr(r.admitted)}</span></div>
        <div class="tile hi" style="padding:11px 13px"><span class="k">Net contribution</span>
          <span class="v" style="font-size:22px">${cr(r.contribution)}</span></div>`;
      rows.forEach((tr,i) => tr.classList.toggle("mark", i === +slider.value));
    }
    slider.addEventListener("input", paint);
    rows.forEach((tr,i) => tr.onclick = () => { slider.value = i; paint(); });
    paint();
  }});

/* ----------------------------------------------------------- 5. evidence --- */
PAGES.push({ id:"evidence", nav:"How honest is it", sub:"the numbers that got worse",
  render(){
  const hr = B.human.rationed;
  const covs = Object.keys(hr).sort((a,b)=>+b-+a);
  return `
  <h2>Everything on this page makes us look worse</h2>
  <p class="lede">Four numbers moved against us and we took all four. This page
  exists because a metrics table where the model always looks good is the least
  informative artifact a project can ship.</p>

  <h3>A human reviewer beats this system</h3>
  <div class="card"><div class="b scroll"><table>
    <thead><tr><th>Reviewer coverage</th><th class="r">Cases reviewed</th>
      <th class="r">Recall of recoverable</th><th class="r">Net contribution</th></tr></thead>
    <tbody>
      <tr><td>A person reviewing all ${n0(O.n_cases)}</td>
        <td class="r">${n0(O.n_cases)}</td><td class="r">${pct(B.human.full.recall)}</td>
        <td class="r" style="color:${C.good};font-weight:600">${cr(B.human.full.contribution)}</td></tr>
      ${covs.map(k => `<tr><td>A person reviewing the top ${pct(+k,0)} by value</td>
        <td class="r">${n0(hr[k].reviewed)}</td><td class="r">${pct(hr[k].recall)}</td>
        <td class="r">${cr(hr[k].contribution)}</td></tr>`).join("")}
      <tr class="mark"><td><b>This system, all ${n0(O.n_cases)}</b></td>
        <td class="r"><b>${n0(O.n_cases)}</b></td><td class="r"><b>${pct(O.recall)}</b></td>
        <td class="r"><b>${cr(O.contribution)}</b></td></tr>
    </tbody></table></div></div>
  <p style="margin-top:11px">On judgment alone a competent reviewer wins, by
  ${cr(B.human.full.contribution - O.contribution)}, and that row stays in the table
  because it is true. What does not survive is its assumption: that a person reviews
  every case. Manual review costs about Rs 150 and four hours each, so real queues
  are ranked by value and worked down until the day runs out. <b>The gap is not
  intelligence. It is reach.</b></p>

  <h3>The numbers move between generated worlds</h3>
  <div class="card"><div class="b scroll"><table>
    <thead><tr><th>seed</th><th class="r">Holdout</th><th class="r">Precision</th>
      <th class="r">Recall</th><th class="r">Fraud admitted</th>
      <th class="r">Net contribution</th></tr></thead>
    <tbody>${SD.rows.map(r => `<tr${r.seed === 42 ? ' class="mark"' : ""}>
      <td class="num">${r.seed}${r.seed === 42 ? ' <span class="tag blue">quoted</span>' : ""}</td>
      <td class="r">${n0(r.n_holdout)}</td><td class="r">${pct(r.shipped_precision)}</td>
      <td class="r">${pct(r.shipped_recall)}</td>
      <td class="r">${cr(r.shipped_fraud_admitted)}</td>
      <td class="r">${cr(r.shipped_contribution)}</td></tr>`).join("")}</tbody>
  </table></div></div>
  <div class="grid tiles" style="margin-top:14px">
    <div class="tile pos"><span class="k">Recall, the steady one</span>
      <span class="v" style="font-size:19px">${pct(SD.recall_min)} to ${pct(SD.recall_max)}</span>
      <span class="s">depends on how well the model ranks</span></div>
    <div class="tile"><span class="k">Precision</span>
      <span class="v" style="font-size:19px">${pct(SD.precision_min)} to ${pct(SD.precision_max)}</span>
      <span class="s">${(100*(SD.precision_max-SD.precision_min)).toFixed(1)} points.
      depends on where a fixed threshold happens to land</span></div>
    <div class="tile"><span class="k">Net contribution</span>
      <span class="v" style="font-size:19px">${cr(SD.contribution_min)} to ${cr(SD.contribution_max)}</span>
      <span class="s">about ${(SD.contribution_max/SD.contribution_min).toFixed(1)}x.
      depends on that world's value distribution</span></div>
  </div>
  <div class="note-box w"><p style="margin:0"><b>An earlier revision called precision
  the stable number at ${pct(SD.tuned_precision_min)} to
  ${pct(SD.tuned_precision_max)}.</b> That range came from a sweep that re-picked the
  threshold on every seed, which absorbs exactly the variation it was meant to
  measure. At a fixed operating point the variation shows up. The claim is
  withdrawn.</p></div>

  <h3>A merchant the model never trained on</h3>
  <div class="grid tiles">
    <div class="tile"><span class="k">AUC cost of dropping ${esc(H.unseen_merchant.merchant)}</span>
      <span class="v">${H.unseen_merchant.auc_drop.toFixed(4)}</span>
      <span class="s">ranking transfers essentially free</span></div>
    <div class="tile neg"><span class="k">Precision at the same cap</span>
      <span class="v" style="font-size:19px">${pct(H.unseen_merchant.precision_full)} to ${pct(H.unseen_merchant.precision_lomo)}</span>
      <span class="s">pricing does not transfer</span></div>
  </div>
  <p style="margin-top:11px">The expensive part, learning what fraud looks like
  across merchants, comes free. The cheap part, calibrating to one merchant's baskets
  and margins, needs a few hundred of their own cases. That is the shape of a
  platform product, and the precision drop is what makes it credible rather than a
  slogan.</p>

  <h3>Value is concentrated</h3>
  <div class="card"><div class="b scroll"><table>
    <thead><tr><th>Merchant</th><th class="r">Blocked</th><th class="r">Good</th>
      <th class="r">Value blocked</th><th class="r">Released</th><th class="r">Precision</th>
      <th class="r">Recovered</th><th class="r">Fraud admitted</th></tr></thead>
    <tbody>${B.merchants.map(m => `<tr><td>${esc(m.merchant)}</td>
      <td class="r">${n0(m.blocked)}</td><td class="r">${pct(m.good/m.blocked,0)}</td>
      <td class="r">${cr(m.value_blocked)}</td><td class="r">${n0(m.released)}</td>
      <td class="r">${m.released ? pct(m.released_good/m.released) : "n/a"}</td>
      <td class="r">${cr(m.recovered)}</td><td class="r">${cr(m.admitted)}</td></tr>`).join("")}</tbody>
  </table></div></div>
  <p class="note" style="margin-top:11px">${esc(B.merchants[0].merchant)} alone is
  ${pct(B.merchants[0].value_blocked / B.merchants.reduce((s,m)=>s+m.value_blocked,0),0)}
  of the holdout's blocked value, so most of the rupee figures here are substantially
  a measurement of one merchant's pile.</p>

  <h3>Two things that were silently broken</h3>
  <p>Neither threw. Neither failed a test. Both had green tests sitting on top of
  them that were measuring nothing, and both were found by reading real output
  instead of a pass count.</p>
  <div class="grid two">
    <div class="card"><h4>The citation checker read payment ids as evidence</h4>
      <div class="b"><p class="note" style="margin:0 0 9px">Every verdict is checked:
      any number in it has to be derivable from the evidence. The extraction regex
      also matched digits inside payment ids, so <code>pay_5E72cODtQrmZkn</code>
      contributed "72", which appears nowhere in the evidence. Every correctly cited
      model verdict failed three times and fell back to a template.</p>
      <p class="note" style="margin:0">Offline runs never caught it because the
      template does not print the payment id. "300 of 300 verdicts audit clean" was
      true, and was measuring a checker that would have rejected every real verdict
      it ever saw.</p></div></div>
    <div class="card"><h4>The demo screen contained no demo cases</h4>
      <div class="b"><p class="note" style="margin:0 0 9px">The case room ran the
      agent over the first 400 blocked orders in date order, then tagged whichever
      matched a showcase role. Five of the six sit past position 400. One tagged case
      rendered out of six, and every verdict on the demo screen was a template.</p>
      <p class="note" style="margin:0">The page looked completely normal. Found by
      counting verdict sources in the generated HTML.</p></div></div>
  </div>
  <div class="note-box"><p style="margin:0">A test that passes tells you the code did
  what the test asked. It does not tell you the test asked for anything.</p></div>

  <div class="foot">The data is synthetic. We wrote the world, so in a real sense we
  wrote the answers; calibrating the generator against published industry figures and
  sweeping its parameters reduces the circularity but does not remove it. The holdout
  is ${n0(O.n_cases)} cases and the intervals are wide. Cross-merchant data has real
  privacy implications; the features are aggregate behavioural counts rather than
  shared personal information, and a payment processor already holds this data, which
  is an argument rather than a dismissal. This does not replace a fraud system. It
  reviews one.</div>`;
  }});

/* ====================================================================== boot */
const nav = document.getElementById("nav"), mainEl = document.getElementById("main");
nav.innerHTML = PAGES.map((p,i) => `<button class="row${i===0?" sel":""}" data-p="${i}">
  <span class="t">${esc(p.nav)}</span><span class="d">${esc(p.sub)}</span></button>`).join("");
document.getElementById("hsub").innerHTML = [
  ["blocked orders reviewed", n0(O.n_cases)],
  ["recall of recoverable", pct(O.recall)],
  ["recovered", cr(O.recovered)],
  ["fraud admitted", cr(O.admitted)],
  ["customers contacted", n0(B.recovery.outcome.contacted)],
  ["median time to money", mins(B.recovery.outcome.median_eta_min)],
].map(([k, v]) => `<span class="hp"><b>${v}</b>${esc(k)}</span>`).join("")
  + `<span class="hp dim"><b>cap ${B.cap}</b>${esc(B.model.learner)}, ${
      B.model.n_trees} trees</span>`;

let at = -1;
function go(i){
  at = i;
  nav.querySelectorAll(".row").forEach((b,j) => b.classList.toggle("sel", j === i));
  const p = PAGES[i];
  mainEl.innerHTML = p.render();
  hideTip();
  if (p.after) p.after();
  mainEl.scrollTop = 0;
  location.hash = p.id;
}
nav.addEventListener("click", e => {
  const b = e.target.closest(".row"); if (b) go(+b.dataset.p); });
/* go() writes the hash, so read it back too: without this the address bar and
   the back button were decorative and a deep link only worked on a cold load. */
const fromHash = () => Math.max(0, PAGES.findIndex(p => "#" + p.id === location.hash));
addEventListener("hashchange", () => { const i = fromHash(); if (i !== at) go(i); });
go(fromHash());
</script>
