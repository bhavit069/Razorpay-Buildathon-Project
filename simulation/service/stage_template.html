<title>Reclaimify — Stage</title>
<style>
/* ---------------------------------------------------------------------------
   The room version. Same numbers as the console on :4000, same engine file,
   different job: that one is read by somebody sitting down, this one is looked
   at by somebody walking past a laptop. So: one screen, no navigating, four
   scenes on number keys, and the money large enough to read from behind a
   chair.

   Dark by default because a lit screen in a bright room needs the contrast,
   with a light theme on the same tokens for anyone who prefers it and for
   projectors, which wash darks out. The choice is remembered.

   The status colours are never neighbours on a chart here either. Recovered
   and admitted sit in separate panels for the same two reasons as on :4000 -
   green against red fails deuteranopia at any lightness, and recovery runs
   about fifteen times fraud admitted so a shared axis flattens the line that
   matters.
--------------------------------------------------------------------------- */
:root{
  --bg:#0b0d11; --panel:#12151b; --panel2:#171b23; --line:#242a35;
  --fg:#e9ecf2; --mut:#8d95a6; --faint:#5b6376;
  --accent:#5b8def; --accent-dim:#1e2a44;
  --good:#3ecf8e; --bad:#f2555a; --warn:#f0a83c;
  --good-bg:#12241c; --bad-bg:#27151a; --warn-bg:#261f12;
  --grid:rgba(255,255,255,.035);
}
:root[data-theme="light"]{
  --bg:#faf9f7; --panel:#ffffff; --panel2:#f4f2ef; --line:#e2e0dc;
  --fg:#1a1a1a; --mut:#6b6b6b; --faint:#b6b2ab;
  --accent:#2b4c7e; --accent-dim:#eef2f8;
  --good:#1a7f4b; --bad:#b3261e; --warn:#a16207;
  --good-bg:#e6f4ec; --bad-bg:#fbeae9; --warn-bg:#fdf4e3;
  --grid:rgba(0,0,0,.03);
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
font:15px/1.5 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif;
display:flex;flex-direction:column;height:100dvh;overflow:hidden;
-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---- top bar ---- */
.top{flex:none;display:flex;align-items:center;gap:16px;padding:11px 20px;
border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;
letter-spacing:-.02em}
.dot{width:8px;height:8px;border-radius:99px;background:var(--good);
box-shadow:0 0 12px var(--good);animation:beat 2.2s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.tag-line{font-size:11px;text-transform:uppercase;letter-spacing:.09em;
color:var(--mut);font-weight:650;padding-left:15px;border-left:1px solid var(--line)}
.scenes{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.scene-btn{background:transparent;border:1px solid transparent;color:var(--mut);
font:inherit;font-size:12px;font-weight:650;letter-spacing:.03em;padding:6px 13px;
border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:7px;
text-transform:uppercase;transition:background .12s,color .12s}
.scene-btn kbd{font:10px ui-monospace,Menlo,monospace;background:var(--panel2);
border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--faint)}
.scene-btn:hover{color:var(--fg);background:var(--panel2)}
.scene-btn.on{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
.scene-btn.on kbd{border-color:var(--accent);color:var(--accent)}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--mut);
font:inherit;font-size:12px;padding:6px 11px;border-radius:7px;cursor:pointer}
.iconbtn:hover{color:var(--fg);border-color:var(--accent)}

/* ---- stage ---- */
.stage{flex:1;min-height:0;overflow:hidden;position:relative}
.scene{position:absolute;inset:0;overflow-y:auto;padding:20px 22px 26px;
display:none}
.scene.on{display:block;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h2{margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.sub{color:var(--mut);font-size:13.5px;margin:0;max-width:78ch}
h3{margin:24px 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;
color:var(--mut);font-weight:700}

/* ---- the counters ---- */
.counters{display:grid;gap:10px;margin-bottom:16px;
grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.ctr{background:var(--panel);border:1px solid var(--line);border-radius:11px;
padding:13px 15px;position:relative;overflow:hidden}
.ctr:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
background:var(--line)}
.ctr.pos:before{background:var(--good)}.ctr.neg:before{background:var(--bad)}
.ctr.key:before{background:var(--accent)}.ctr.warn:before{background:var(--warn)}
.ctr .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;
color:var(--mut);font-weight:700;display:block}
.ctr .v{font-size:27px;font-weight:700;letter-spacing:-.03em;margin-top:5px;
display:block;line-height:1.05;font-variant-numeric:tabular-nums}
.ctr.pos .v{color:var(--good)}.ctr.neg .v{color:var(--bad)}
.ctr.key .v{color:var(--accent)}
.ctr .s{font-size:11.5px;color:var(--mut);margin-top:4px;display:block;line-height:1.35}
.ctr .v.big{font-size:34px}

/* ---- the pipeline ---- */
.pipe{background:var(--panel);border:1px solid var(--line);border-radius:11px;
padding:16px;overflow-x:auto;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),
linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
.pipe-row{display:grid;gap:10px;min-width:760px;
grid-template-columns:repeat(5,minmax(0,1fr))}
.st{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
padding:11px 12px;min-height:172px;display:flex;flex-direction:column;position:relative}
.st:after{content:"";position:absolute;right:-11px;top:50%;width:10px;height:1px;
background:var(--line)}
.st:last-child:after{display:none}
.st .h{display:flex;align-items:baseline;gap:7px;margin-bottom:9px}
.st .n{font-size:10px;text-transform:uppercase;letter-spacing:.08em;
color:var(--mut);font-weight:700}
.st .c{margin-left:auto;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-direction:column;gap:4px;overflow:hidden;flex:1}
.pc{display:flex;align-items:center;gap:7px;background:var(--panel);
border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11.5px;
animation:slide .3s ease;white-space:nowrap;overflow:hidden}
@keyframes slide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.pc .m{overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.pc .a{margin-left:auto;font-weight:650;font-variant-numeric:tabular-nums}
.pc.good{border-left:2px solid var(--good)}
.pc.bad{border-left:2px solid var(--bad)}
.pc.warn{border-left:2px solid var(--warn)}
.pc.blue{border-left:2px solid var(--accent)}

/* ---- spotlight ---- */
.cols{display:grid;gap:14px;margin-top:14px;
grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px}
.panel>.hd{padding:10px 14px;border-bottom:1px solid var(--line);font-size:10.5px;
text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700;
display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.panel>.bd{padding:13px 14px}

.pill{display:inline-block;font-size:9.5px;text-transform:uppercase;
letter-spacing:.07em;padding:2px 7px;border-radius:4px;font-weight:750;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.blue{background:var(--accent-dim);color:var(--accent)}
.pill.neut{background:var(--panel2);color:var(--mut)}

.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;font-size:12.5px}
.kv .l{color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.kv .r{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}

/* ---- huge type for the WHY scene ---- */
.hero{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));
margin:18px 0}
.big{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:22px}
.big .n{font-size:clamp(34px,6vw,60px);font-weight:800;letter-spacing:-.04em;
line-height:1;font-variant-numeric:tabular-nums}
.big .n.bad{color:var(--bad)}.big .n.good{color:var(--good)}.big .n.key{color:var(--accent)}
.big .t{margin-top:9px;font-size:14px;color:var(--fg);font-weight:600}
.big .d{margin-top:5px;font-size:12.5px;color:var(--mut);line-height:1.45}
.ratio{display:flex;height:44px;border-radius:9px;overflow:hidden;
border:1px solid var(--line);margin:6px 0 8px}
.ratio>div{display:flex;align-items:center;padding:0 13px;font-size:12.5px;
font-weight:650;white-space:nowrap;overflow:hidden}
.ratio .l{background:var(--bad-bg);color:var(--bad)}
.ratio .r{background:var(--good-bg);color:var(--good);justify-content:flex-end}

/* ---- tables, bars, code ---- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.07em;
color:var(--mut);font-weight:700;padding:6px 9px;border-bottom:1px solid var(--line);
white-space:nowrap}
td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.hi td{background:var(--accent-dim)}
.scroll{overflow-x:auto}
.bars{display:flex;flex-direction:column;gap:7px}
.br{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:10px;
align-items:center;font-size:12px}
.trk{background:var(--panel2);border-radius:4px;height:14px;overflow:hidden}
.fil{height:100%;border-radius:0 4px 4px 0;transition:width .4s ease}
.br .n{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums;font-size:11.5px}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
padding:11px 13px;overflow-x:auto;margin:0;
font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg)}
pre .c{color:var(--faint)}pre .g{color:var(--good)}pre .r{color:var(--bad)}
pre .k{color:var(--accent)}
code{background:var(--panel2);padding:1px 5px;border-radius:4px;
font:12px ui-monospace,Menlo,Consolas,monospace}
.note{color:var(--mut);font-size:12.5px;line-height:1.5;max-width:74ch}
.callout{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
border-radius:9px;padding:12px 15px;margin:14px 0;font-size:13px;line-height:1.55}
.callout.warn{border-left-color:var(--warn)}
.callout b{color:var(--fg)}
button.act{background:var(--accent);border:1px solid var(--accent);color:#fff;
font:inherit;font-size:13px;font-weight:650;padding:8px 16px;border-radius:8px;cursor:pointer}
button.act:hover{filter:brightness(1.1)}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);
font:inherit;font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer}
button.ghost:hover{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
svg.chart{display:block;width:100%;height:auto}

/* ---- the ladder ---- */
.lad{display:flex;flex-direction:column;gap:0}
.lr{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;
align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lr:last-child{border-bottom:0}
.gl{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;
justify-content:center;font-size:12px;font-style:normal}
.gl.good{background:var(--good-bg);color:var(--good)}
.gl.blue{background:var(--accent-dim);color:var(--accent)}
.gl.neut{background:var(--panel2);color:var(--mut)}
.gl.warn{background:var(--warn-bg);color:var(--warn)}
.gl.bad{background:var(--bad-bg);color:var(--bad)}
.lr .nm{font-size:13px;font-weight:600;display:block}
.lr .mt{font-size:11.5px;color:var(--mut);display:block;margin-top:1px}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;
transition-duration:.001ms!important}}
@media(max-width:900px){
  .scene{padding:16px 14px 22px}
  .top{padding:10px 14px;gap:10px}
  .tag-line{display:none}
  .scenes{margin-left:0;width:100%;overflow-x:auto}
  .scene-btn kbd{display:none}
  .pipe-row{min-width:660px}
}
@media(max-width:560px){
  .ctr .v{font-size:22px}.ctr .v.big{font-size:26px}
  h2{font-size:19px}
  .br{grid-template-columns:minmax(70px,36%) 1fr auto;gap:8px}
  .note{max-width:none}
}
</style>

<div class="top">
  <span class="brand"><span class="dot"></span>Reclaimify</span>
  <span class="tag-line">false-decline recovery</span>
  <span class="scenes" id="scenes"></span>
  <button class="iconbtn" id="theme" title="Light or dark">&#9681;</button>
</div>
<div class="stage" id="stage"></div>

<script>
const B = __BUNDLE__;
</script>

<script>
__ENGINE__

/* ------------------------------------------------------------------ theme */
/* Remembered per browser. Wrapped because a private window, cleared site data
   or a thumbnail capture can each make storage throw rather than return null. */
(function(){
  let t = null;
  try { t = localStorage.getItem("rk-theme"); } catch (e) {}
  if (t === "light") document.documentElement.setAttribute("data-theme", "light");
  document.getElementById("theme").onclick = () => {
    const light = document.documentElement.getAttribute("data-theme") === "light";
    if (light) document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", "light");
    try { localStorage.setItem("rk-theme", light ? "dark" : "light"); } catch (e) {}
    if (SCENES[at] && SCENES[at].repaint) SCENES[at].repaint();
  };
})();
const themeColor = (k) => getComputedStyle(document.documentElement)
  .getPropertyValue("--" + k).trim() || "#888";

const O = B.outcome, RCO = B.recovery.outcome;
const SCENES = [];

/* ================================================================ 1. live === */
SCENES.push({ key:"live", name:"Live",
  html(){ return `
  <div class="counters" id="ctrs"></div>
  <div class="pipe"><div class="pipe-row" id="pipe"></div></div>
  <div class="cols">
    <div class="panel"><div class="hd">In the spotlight
      <span style="flex:1"></span><span class="pill neut" id="spid"></span></div>
      <div class="bd" id="spot"></div></div>
    <div class="panel"><div class="hd">Outreach mix</div>
      <div class="bd" id="mix"></div></div>
  </div>
  <div class="callout"><b>What is real and what is not.</b> The cases are drawn
    from the ${n0(O.n_cases)} blocked orders the model never trained on. The
    probability is the model's, the action is the policy's, the ladder is
    <code>core/recovery.py</code>. Arrival timing and whether a contacted customer
    answered are simulated from a seeded draw against declared rates. Whether a
    returning order turns out to be fraud is <b>the answer key, not a coin</b>.</div>`;
  },
  start(){
    this.run = newRun(7);
    this.stations = [[], [], [], [], []];
    const $ = (id) => document.getElementById(id);
    const seen = new Set();

    this.repaint = () => {
      const r = this.run;
      const net = r.recovered * B.margin - r.admitted - r.spend;
      const et = r.etas.slice().sort((a, b) => a - b);
      $("ctrs").innerHTML = [
        ["Blocked orders seen", n0(r.n), `${r.released} released &middot; ${r.upheld} upheld`, "key", 1],
        ["Customers back", n0(r.returns), `${r.lost} did not come back`, "", 0],
        ["Revenue recovered", cr(r.recovered), "good orders that returned", "pos", 1],
        ["Fraud admitted", cr(r.admitted), "bad orders that returned", "neg", 0],
        ["Outreach spend", rs(r.spend), "messages, calls, reviewer time", "", 0],
        ["Net contribution", cr(net), `${pct(B.margin,0)} margin, less fraud and spend`,
         net >= 0 ? "pos" : "neg", 1],
        ["Median time to money", et.length ? mins(et[et.length >> 1]) : "&mdash;",
         "block to completed order", "warn", 0],
      ].map(([k, v, s, cls, big]) => `<div class="ctr ${cls}"><span class="k">${k}</span>
        <span class="v${big ? " big" : ""}">${v}</span><span class="s">${s}</span></div>`).join("");

      const STAGES = [
        ["Blocked", "arrived"], ["Scored", "model"], ["Decided", "policy"],
        ["Reaching out", "in flight"], ["Settled", "returned or lost"]];
      $("pipe").innerHTML = STAGES.map(([n, sub], i) => `<div class="st">
        <div class="h"><span class="n">${n}</span>
          <span class="c">${n0(this.counts[i])}</span></div>
        <div class="chips">${this.stations[i].slice(0, 5).map(x => x).join("")}</div>
        <span class="n" style="margin-top:auto;color:var(--faint)">${sub}</span>
      </div>`).join("");

      const tot = Object.values(r.mix).reduce((a, m) => a + m.n, 0) || 1;
      $("mix").innerHTML = `<div class="bars">${B.recovery.channels
        .filter(c => r.mix[c.key]).map(c => `<div class="br">
          <span>${esc(c.name)}</span>
          <span class="trk"><span class="fil" style="width:${
            (100 * r.mix[c.key].n / tot).toFixed(1)}%;background:${
            themeColor(({good:"good",blue:"accent",neut:"mut",warn:"warn",bad:"bad"})[CHTONE[c.key]])
            }"></span></span>
          <span class="n">${r.mix[c.key].n} &middot; ${rs(r.mix[c.key].cost)}</span>
        </div>`).join("")}</div>
        <p class="note" style="margin:11px 0 0">An SMS is ${rs(CH.sms.cost)} and a
        human callback ${rs(CH.human.cost)}. The ladder reaches for the expensive one
        only where the case value carries it.</p>`;

      const it = this.spot;
      if (it){
        const c = it.c;
        $("spid").textContent = c.payment_id;
        const pl = rPlan(c.action, c.ev, c.amount, c.orders, c.tenure);
        $("spot").innerHTML = `
          <div class="row" style="margin-bottom:11px">
            <span class="pill ${TONE[c.action]}">${c.action}</span>
            <b style="font-size:19px;letter-spacing:-.02em">${cr(c.amount)}</b>
            <span class="note" style="margin:0">${esc(c.merchant)} &middot; blocked for
              ${esc(c.reason.replace(/_/g, " "))}</span></div>
          <div class="kv">
            <span class="l">Probability the block was correct</span>
              <span class="r">${c.p_bad.toFixed(4)}</span>
            <span class="l">Prior orders across the network</span>
              <span class="r">${n0(c.orders)}</span>
            <span class="l">Days since first seen</span>
              <span class="r">${n0(c.tenure)}</span>
            <span class="l">Worth recovering</span><span class="r">${rs(pl.value)}</span>
          </div>
          <h3 style="margin:15px 0 6px">Then we go and get them</h3>
          <div class="lad">${pl.rungs.map(g => `<div class="lr">
            <span class="gl ${CHTONE[g.channel]}">${CHICON[g.channel]}</span>
            <span><span class="nm">${esc(CH[g.channel].name)}</span>
              <span class="mt">${g.at < 1 ? "immediately" : "after " + mins(g.at)}
                &middot; ${rs(g.cost)}${g.committed ? " &middot; mandated" : ""}</span></span>
            <span class="pill neut">${pct(g.p, 0)}</span></div>`).join("")
            || '<p class="note" style="margin:0">Block stands. Nothing to recover.</p>'}
          </div>
          ${pl.rungs.length ? `<p class="note" style="margin:10px 0 0">
            ${pct(pl.p, 0)} come back, ${rs(pl.cost)} of outreach, typically
            ${mins(pl.eta)} from block to completed order.</p>` : ""}`;
      }
    };

    this.counts = [0, 0, 0, 0, 0];
    this.push = (i, it) => {
      const c = it.c;
      const tone = i === 4 ? (it.state === "returned" ? "good" : "neut")
                 : i >= 2 ? TONE[c.action] : "blue";
      this.stations[i].unshift(`<span class="pc ${tone}">
        <span class="m">${esc(c.merchant)}</span>
        <span class="a">${cr(c.amount)}</span></span>`);
      if (this.stations[i].length > 5) this.stations[i].pop();
      this.counts[i]++;
    };

    let last = performance.now(), acc = 0;
    const frame = (now) => {
      if (!document.getElementById("pipe")) return;      // scene changed
      const dt = Math.min(250, now - last); last = now;
      if (this.playing !== false){
        const before = { n: this.run.n, done: this.run.returns + this.run.lost };
        liveTick(this.run, dt / 1000 * 40);
        // feed the stations from what actually moved, so the picture and the
        // tally cannot drift apart
        for (const it of this.run.feed){
          if (seen.has(it.key)) continue;
          seen.add(it.key);
          this.push(0, it); this.push(1, it); this.push(2, it);
          if (it.plan.rungs.length) this.push(3, it);
          this.spot = it;
        }
        for (const it of this.run.done){
          if (seen.has(it.key + "_d")) continue;
          seen.add(it.key + "_d");
          this.push(4, it);
        }
        acc += dt;
        if (acc > 120){ acc = 0; this.repaint(); }
      }
      requestAnimationFrame(frame);
    };
    this.repaint();
    requestAnimationFrame(frame);
  }});

/* ================================================================= 2. why === */
SCENES.push({ key:"why", name:"Why",
  html(){
    const s = B.stats;

/* ================================================================== charts === */
function svgMulti(series, names, colors, opts){
  opts = opts || {};
  const W = 620, H = opts.h || 210, P = { l:42, r:120, t:12, b:28 };
  const all = series.flat();
  const x0 = Math.min(...all.map(d => d.x)), x1 = Math.max(...all.map(d => d.x));
  const y1 = Math.max(...all.map(d => d.y)) * 1.08 || 1;
  const X = v => P.l + (v - x0) / (x1 - x0 || 1) * (W - P.l - P.r);
  const Y = v => H - P.b - v / y1 * (H - P.t - P.b);
  const line = themeColor("line"), mut = themeColor("mut");
  const ends = series.map((s, i) => ({ i, y: Y(s[s.length - 1].y) }))
                     .sort((a, b) => a.y - b.y);
  ends.forEach((e, k) => { if (k && e.y - ends[k-1].y < 14) e.y = ends[k-1].y + 14; });
  const ly = {}; ends.forEach(e => ly[e.i] = e.y);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      preserveAspectRatio="xMidYMid meet" aria-label="${esc(opts.aria || "chart")}">
    ${[0, y1/2, y1].map(t => `<line x1="${P.l}" x2="${W-P.r}" y1="${Y(t).toFixed(1)}"
        y2="${Y(t).toFixed(1)}" stroke="${line}"/>
      <text x="${P.l-8}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end" fill="${mut}"
        font-size="10.5">${(100*t).toFixed(0)}%</text>`).join("")}
    ${[0,240,480,960,1440].filter(t => t >= x0 && t <= x1).map(t =>
      `<text x="${X(t).toFixed(1)}" y="${H-9}" text-anchor="middle" fill="${mut}"
        font-size="10.5">${esc(mins(t))}</text>`).join("")}
    ${series.map((s, i) => `<polyline fill="none" stroke="${colors[i]}" stroke-width="2"
        stroke-linejoin="round"
        points="${s.map(d => `${X(d.x).toFixed(1)},${Y(d.y).toFixed(1)}`).join(" ")}"/>`).join("")}
    ${series.map((s, i) => { const l = s[s.length - 1];
      return `<line x1="${X(l.x).toFixed(1)}" x2="${(W-P.r+8).toFixed(1)}"
          y1="${Y(l.y).toFixed(1)}" y2="${ly[i].toFixed(1)}" stroke="${colors[i]}"
          stroke-width="1" opacity=".45"/>
        <text x="${W-P.r+12}" y="${(ly[i]+3.5).toFixed(1)}" fill="${colors[i]}"
          font-size="11" font-weight="600">${esc(names[i])}</text>`; }).join("")}
  </svg>`;
}

/* ==================================================================== boot === */
const stageEl = document.getElementById("stage");
let at = -1;
stageEl.innerHTML = SCENES.map((s, i) =>
  `<div class="scene" id="sc${i}"></div>`).join("");
document.getElementById("scenes").innerHTML = SCENES.map((s, i) =>
  `<button class="scene-btn" data-s="${i}"><kbd>${i+1}</kbd>${esc(s.name)}</button>`).join("");

function go(i){
  i = Math.max(0, Math.min(SCENES.length - 1, i));
  if (i === at) return;
  at = i;
  SCENES.forEach((s, k) => {
    const el = document.getElementById("sc" + k);
    el.classList.toggle("on", k === i);
    if (k === i && !el.dataset.built){
      el.innerHTML = s.html();
      el.dataset.built = "1";
      if (s.start) s.start();
    } else if (k === i && s.repaint) {
      s.repaint();
    }
  });
  document.querySelectorAll("[data-s]").forEach((b, k) =>
    b.classList.toggle("on", k === i));
  location.hash = SCENES[i].key;
}
document.getElementById("scenes").addEventListener("click", e => {
  const b = e.target.closest("[data-s]"); if (b) go(+b.dataset.s); });
addEventListener("keydown", e => {
  if (e.target.matches("input, textarea, select")) return;
  const n = "12345".indexOf(e.key);
  if (n >= 0) go(n);
  else if (e.key === "ArrowRight") go(at + 1);
  else if (e.key === "ArrowLeft") go(at - 1);
});
const fromHash = () => Math.max(0, SCENES.findIndex(s => "#" + s.key === location.hash));
addEventListener("hashchange", () => go(fromHash()));
go(fromHash());
</script>
